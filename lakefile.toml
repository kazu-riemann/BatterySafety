name = "BatterySafety"
defaultTargets = ["battsafeproof", "battsafecheck"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "BatterySafety"

[[lean_exe]]
name = "battsafeproof"
root = "BatterySafety.BattSafeProof"

[[lean_exe]]
name = "battsafecheck"
root = "BatterySafety.BattSafeCheck"
